name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 / LMDE 7 (Qt 6.8)
            image: debian:trixie
          - name: Ubuntu 24.04 / Linux Mint 22 (Qt 6.4)
            image: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build and test packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential pkgconf qmake6 \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-svg-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtmultimedia \
            libglib2.0-dev libx11-dev libxrandr-dev libxext-dev \
            ffmpeg mpv python3 python3-gi gir1.2-gtk-3.0 xvfb xauth
          # Plugin packages whose names differ between releases.
          for package in qt6-qpa-plugins qt6-svg-plugins qt6-image-formats-plugins; do
            apt-get install -y --no-install-recommends "$package" || echo "::notice::$package is not packaged here"
          done
      - uses: actions/checkout@v4
      - name: Build
        run: ./bin/build
      - name: Tests
        run: ./bin/test
      - name: GTK desktop-transparency regression
        run: xvfb-run -a python3 tests/gtk_desktop_regression.py
