name: CI

# Every push is built, tested and packaged for both systems, and each package
# is installed on a clean system. Pushing a tag such as v1.3.0 also publishes
# the packages as a GitHub release.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build · ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 / LMDE 7 (Qt 6.8)
            image: debian:trixie
            target: debian13-lmde7
            asset: cinnarchy-lmde-7-debian-13.deb
          - name: Ubuntu 24.04 / Linux Mint 22 (Qt 6.4)
            image: ubuntu:24.04
            target: ubuntu24.04-mint22
            asset: cinnarchy-linux-mint-22.deb
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build and test packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential dpkg-dev pkgconf qmake6 \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtmultimedia \
            libglib2.0-dev libx11-dev libxrandr-dev libxext-dev \
            ffmpeg mpv gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav python3 python3-gi gir1.2-gtk-3.0 xvfb xauth
          # Packages that exist under different names, or not at all, depending
          # on the release. bin/package-deb fails if a file it needs is absent.
          for package in qt6-svg-dev libqt6svg6-dev qt6-qpa-plugins qt6-svg-plugins \
              qt6-image-formats-plugins qml6-module-qtqml qml6-module-qtqml-models; do
            apt-get install -y --no-install-recommends "$package" || echo "::notice::$package is not packaged here"
          done
      - uses: actions/checkout@v4
      - name: Build
        run: ./bin/build
      - name: Tests
        run: ./bin/test
      - name: GTK desktop-transparency regression
        run: xvfb-run -a python3 tests/gtk_desktop_regression.py
      - name: Package
        run: |
          ./bin/package-deb app
          # One fixed name per system, so the README's download links always
          # reach the newest release.
          mv pkgdeb/cinnarchy_*_amd64.deb "pkgdeb/${{ matrix.asset }}"
          dpkg-deb --info "pkgdeb/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target }}
          path: pkgdeb/${{ matrix.asset }}
          if-no-files-found: error

  install:
    name: Clean install · ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 / LMDE 7
            image: debian:trixie
            target: debian13-lmde7
            asset: cinnarchy-lmde-7-debian-13.deb
          - name: Ubuntu 24.04 / Linux Mint 22
            image: ubuntu:24.04
            target: ubuntu24.04-mint22
            asset: cinnarchy-linux-mint-22.deb
    env:
      DEBIAN_FRONTEND: noninteractive
      GSETTINGS_BACKEND: memory
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.target }}
      - name: Install the package on a system with nothing else
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./cinnarchy-*.deb
      - name: Run the installed picker
        run: |
          cinnarchy --version
          test "$(cinnarchy list --json | grep -o '"slug"' | wc -l)" -ge 23
          cinnarchy status --json
          cinnarchy screenshot --select tokyo-night --output picker.png
          test -s picker.png
      - uses: actions/upload-artifact@v4
        with:
          name: picker-${{ matrix.target }}
          path: picker.png

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in dist/cinnarchy-*.deb; do
            packaged="$(dpkg-deb -f "$package" Version)"
            test "${packaged%-*}" = "$version" || { echo "::error::$package is $packaged, not $version"; exit 1; }
          done
          (cd dist && sha256sum cinnarchy-*.deb > SHA256SUMS)
          {
            awk -v heading="## $version " 'index($0, heading) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md
            cat .github/release-notes-footer.md
          } > notes.md
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Cinnarchy $version" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
